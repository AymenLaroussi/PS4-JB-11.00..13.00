<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ps4 jailbreak</title>
<style>
  html, body { margin:0; padding:0; background:#000; color:#00ff41;
               font:15px/1.45 "Courier New", Consolas, monospace;
               height:100%; overflow:hidden; }
  #bgvideo { position:fixed; top:0; right:0; bottom:0; left:0;
             width:100%; height:100%; object-fit:cover; z-index:0;
             background:#000; }
  #overlay { position:fixed; top:0; right:0; bottom:0; left:0; z-index:1;
             background:rgba(0,0,0,.48); }
  #scan { position:fixed; top:0; right:0; bottom:0; left:0; z-index:4;
          pointer-events:none; opacity:.55;
          background:repeating-linear-gradient(0deg,
              rgba(0,255,65,.05) 0 1px, transparent 1px 3px); }
  #wrap { position:relative; z-index:2; height:100vh; box-sizing:border-box;
          padding:20px; display:flex; flex-direction:column;
          justify-content:center; align-items:center;
          text-align:center; }
  #state { font-size:36px; font-weight:700; margin:0 0 14px;
           letter-spacing:.08em; color:#00ff41;
           text-shadow:0 0 10px rgba(0,255,65,.8), 0 0 24px rgba(0,255,65,.4); }
  #det { font-size:15px; color:#5dff7a; margin:0 0 6px;
         letter-spacing:.04em; text-shadow:0 0 8px rgba(0,255,65,.4); }
  #det b { color:#9dffb0; font-weight:700; }
  #cache { font-size:13px; color:#3fbf55; margin:0 0 10px; min-height:14px;
           letter-spacing:.05em; }
  #cache.cacheok { color:#00ff41; text-shadow:0 0 8px rgba(0,255,65,.5); }
  .ok { color:#00ff41; } .bad { color:#ff4040; text-shadow:0 0 10px rgba(255,0,0,.6); }
  .warn { color:#ffe14a; text-shadow:0 0 10px rgba(255,225,74,.5); }
  #author { position:fixed; bottom:10px; left:0; right:0; z-index:5;
            text-align:center; font-size:14px; font-weight:700;
            letter-spacing:.1em; color:rgba(0,255,65,.75);
            text-shadow:0 0 10px rgba(0,255,65,.5);
            pointer-events:none; }
</style>
</head>
<body>
<video id="bgvideo" autoplay muted loop playsinline>
  <source src="public/loading.mp4" type="video/mp4">
</video>
<div id="overlay"></div>
<div id="wrap">
  <div id="state">detecting firmware...</div>
  <div id="det"></div>
  <div id="cache"></div>
</div>
<div id="scan"></div>
<div id="author">&copy; 2026 Aymen Laroussi</div>
<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var video = document.getElementById("bgvideo");
    var vids = {
        loading: "public/loading.mp4",
        success: "public/success.mp4",
        error: "public/error.mp4",
        unsupported: "public/notsupport.mp4"
    };
    function play(src) {
        if (video.currentSrc && video.currentSrc.indexOf(src) !== -1) return;
        video.src = src;
        video.load();
        video.play().catch(function () {});
    }
    window.ps4video = function (status) {
        play(vids[status] || vids.loading);
    };
    window.ps4video("loading");
    function setState(t, c) {
        stateEl.textContent = t;
        stateEl.className = c || "";
        try {
            if (c === "bad") window.ps4video("unsupported");
        } catch (e) { }
    }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50";
    } else {
        why = key + " -- no working bug (lapse ends at 12.02, poops needs 12.50)";
    }
    detEl.innerHTML = "firmware <b>" + (key || "unknown") + "</b>"
        + " &middot; bug <b>" + (bug || "none") + "</b> &middot; " + why;

    if (!bug) { setState("UNSUPPORTED FIRMWARE", "bad"); return; }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    function go() { setState("loading " + bug + " chain...", "warn");
                    location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("offline -- from cache", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("cached", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        waitForTap("UPDATE READY -- press X or tap to reload & run",
                   function () { location.reload(); });
    } else {
        setCache("checking cache...");
        ac.addEventListener("downloading",
            function () { setCache("caching for offline (first run)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("caching " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("cached for offline use", true);
            waitForTap("CACHED (first run) -- press X or tap to run", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("update downloaded", true);
            waitForTap("UPDATE READY -- press X or tap to reload & run",
                       function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("cached -- offline ready", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("cache unavailable");
            waitForTap("CACHE FAILED -- press X or tap to run anyway", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("cache obsolete");
            waitForTap("CACHE OBSOLETE -- press X or tap to run", go);
        }, false);
    }
})();
</script>
</body>
</html>
